study_name: privacy_policy_summarisation_main_study_faithfulness
random_seed: 20260814
temperature: 0.0
max_output_tokens: 1500
timeout_seconds: 120
retries_on_technical_failure: 2
output_language: English

models:
  gpt:
    provider: openai
    model_id: gpt-5.6-luna
    temperature: null
  llama:
    provider: together
    model_id: meta-llama/Llama-3.3-70B-Instruct-Turbo
    temperature: 0.0
  mistral:
    provider: mistral
    model_id: mistral-large-2512
    temperature: 0.0

prompts:
  zero: prompts/zero_v1.0.txt
  role: prompts/role_v1.0.txt
  structured: prompts/structured_v1.0.txt

paths:
  raw: data/main/raw
  clean: data/main/clean
  metadata: data/main/metadata/policies.csv
  outputs: data/main/outputs
  logs: data/main/logs/generation_log.csv
  evaluations: data/main/evaluations/metrics.csv
  anonymised: data/main/anonymised

faithfulness:
  blind_ids: all
  blinding_key: data/main/anonymised/BLINDING_KEY_RESTRICTED.csv
  human_labels: [Supported, Partially supported, Unsupported, Contradicted]
  gemini_model: gemini-3.5-flash-lite
  gemini_temperature: 0.0
  gemini_free_tier: true
  gemini_batch_delay_seconds: 10
  gemini_max_claims_per_batch: 5
  minicheck_model: flan-t5-large
  prepared_dir: data/main/faithfulness
  results_dir: data/main/evaluations/faithfulness

coverage:
  policy_id: MAIN17
  summary_glob: CV17-*.txt
  taxonomy_version: nine-category-pilot-frozen-v1
  expected_units: 126
  expected_summaries: 9
  frozen_units: data/main/coverage_validation/MAIN17/frozen/source_units_MAIN17.csv
  blinded_summaries_dir: data/main/coverage_validation/MAIN17/coverage_scoring_blinded
  results_dir: data/main/coverage_validation/MAIN17/evaluations
  gemini_model: gemini-3.5-flash-lite
  gemini_temperature: 0.0
  gemini_free_tier: true
  gemini_max_units_per_batch: 15
  gemini_batch_delay_seconds: 10
  json_retries: 1
  max_output_tokens: 8192
  timeout_seconds: 300
